<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">    
</head>
<body>
    <div class="table1">    
    <!-- <img src="./background img.avif" alt=""> -->

    <h1>Registration form</h1>
    </div>

    <!-- <h1>Registration form</h1> -->


    <div class="table">
    <p>Name <span class="required">*</span></p>
    <i class="fa-regular fa-user" style="color: rgb(158, 163, 169);"></i>    
    <input type="text" placeholder="Enter Your Name">
    </div>    

    <div class="table">
    <p>Father Name<span class="required">*</span></p>
    <i class="fa-regular fa-user" style="color: rgb(158, 163, 169);"></i>
    <input type="text" placeholder="Enter Your Father's Name">
    </div>

    
    <div class="table">
    <p >Date<span class="required">*</span></p>
    <i class="fa-regular fa-calendar" style="color: rgb(158, 163, 169);"></i>
    <input type="date" >
    </div>

    <div class="table">
    <p>Email<span class="required">*</span></p>
    <i class="fa-regular fa-envelope" style="color: rgb(158, 163, 169);"></i>
    <input type="email" placeholder="your.email@example.com">
    </div>
    

    <div class="table">
    <p>Phone<span class="required">*</span></p>
    <i class="fa-solid fa-phone" style="color: rgb(158, 163, 169);"></i>
    <input type="text" placeholder="Enter Phone Number" >
    </div>
    
    <div class="table">
    <p>Father's Phone<span class="required">*</span></p>
    <i class="fa-solid fa-phone" style="color: rgb(158, 163, 169);"></i>
    <input type="text" placeholder="Enter Phone Number" >
    </div>
    

    <div class="table">
    <p>ID Card<span class="required">*</span></p>
    <i class="fa-regular fa-id-card" style="color: rgb(158, 163, 169);"></i>
    <input type="text" placeholder="Enter Phone Number" >
    </div>
    
    <div class="table">
    <p>Father's ID Card<span class="required">*</span></p>
    <i class="fa-regular fa-id-card" style="color: rgb(158, 163, 169);"></i>
    <input type="text" placeholder="Enter Phone Number" >
    </div>
</body>
</html>
